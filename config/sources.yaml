# --- Rejected ---
# All of these were tested on the date noted. Do not re-add without evidence
# that the endpoint changed.
#
# Calcalist (https://www.calcalist.co.il/GeneralRSS/0,16335,L-3704,00.xml)
#   403 Forbidden, including with a browser User-Agent. Blocked server-side.
#   Tested again 2026-08-31 on the general feed: still 403.
# Jerusalem Post (https://www.jpost.com/rss/rssfeedsheadlines.aspx)
#   Returns 200 and parses, but the newest item is from 2025-06-16. The feed is
#   abandoned. It would have quietly fed us year-old news as if it were today's.
# Hebrew University (https://en.huji.ac.il/rss.xml)
#   One item, dated 2020-12-27, titled "About". Not a news feed.
# Technion (https://www.technion.ac.il/feed/)  301 then a parse error.
# Kan news (https://www.kan.org.il/rss/news.xml)  403.
# EurekAlert (https://www.eurekalert.org/rss/all.xml)  404 on that path.
# Weizmann (https://www.weizmann.ac.il/pages/rss.xml)
#   Alive, but it publishes staff pages rather than research news.
# Nature Briefing (https://www.nature.com/nature/articles.rss)
#   Byte-identical to the Nature feed above. One of the two is enough.
# arXiv (https://rss.arxiv.org/rss/*)
#   Deliberately excluded. Preprints are not peer reviewed, and this paper's
#   rule is that nothing is printed unverified. Reachable if that ever changes.
